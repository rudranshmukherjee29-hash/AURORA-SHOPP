# =====================================================================
#  AuroraShop — item catalogue & default pricing
#
#  This is a CURATED list (not every vanilla item) — see README.md,
#  "Economy Balancing", for the full rationale behind every price.
#
#  Every "conversions" entry below is used by PriceValidator at startup
#  and by /shopadmin validateprices to detect buy→convert→sell profit
#  loops. Three relationship kinds are supported:
#
#    smeltsFrom: <id>
#        A 1:1 furnace conversion from another priced item.
#
#    compressesInto: {item: <id>, ratio: N}
#        N of *this* item craft into 1 of <id>, AND vanilla also lets
#        you craft 1 of <id> back into N of this item (true for the
#        ingot/gem <-> block pairs, and the nugget <-> ingot pair).
#        Both directions are checked automatically.
#
#    craftsFrom: {outputAmount: N, components: [{item, amount}, ...]}
#        This item is crafted from the listed components, yielding N
#        of this item per craft. Only checked forward (most crafting
#        recipes have no vanilla "uncraft" reverse).
#
#  Any component referenced by id must exist elsewhere in this file.
# =====================================================================

