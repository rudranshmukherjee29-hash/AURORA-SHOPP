# =====================================================================
#  AuroraShop — GUI configuration
#  Titles support MiniMessage. Slot numbers are 0-based within a 54-slot
#  (6-row) chest inventory. Changing slot numbers is safe; changing the
#  *count* of rows is not currently supported.
# =====================================================================

titles:
  main-menu: "<dark_gray>Aurora<gold><bold>Shop"
  category: "<dark_gray>Aurora<gold><bold>Shop <dark_gray>› <white>{category}"
  search: "<dark_gray>Aurora<gold><bold>Shop <dark_gray>› <white>Search: {query}"
  confirm: "<dark_gray>Confirm Transaction"

main-menu:
  # Slots where category icons are placed, in the order categories are
  # defined in shops.yml. Extra categories beyond this list simply won't
  # appear on the main menu (but remain reachable via /shop <id>).
  category-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
  close-slot: 49
  balance-slot: 4
  decorative-border: true
  border-material: BLACK_STAINED_GLASS_PANE

category-menu:
  # 45 item slots per page (rows 1-5), row 6 (45-53) is the control bar.
  items-per-page: 45
  control-bar:
    back-slot: 45
    prev-page-slot: 46
    quantity-toggle-slot: 47
    search-slot: 48
    page-indicator-slot: 49
    sellhand-slot: 50
    sellall-slot: 51
    next-page-slot: 52
    close-slot: 53

confirm-menu:
  confirm-slot: 11
  cancel-slot: 15
  info-slot: 13

sounds:
  enabled: true
  buy: ENTITY_EXPERIENCE_ORB_PICKUP
  sell: ENTITY_ITEM_PICKUP
  error: ENTITY_VILLAGER_NO
  click: UI_BUTTON_CLICK
  page-turn: ITEM_BOOK_PAGE_TURN

item-display:
  # MiniMessage lines shown under an item's name. Placeholders: {buy},
  # {sell}, {buy_enabled}, {sell_enabled}, {stock}, {stock_max}.
  lore-buy-enabled: "<gray>Buy: <green>{buy}"
  lore-buy-disabled: "<gray>Buy: <red>Unavailable"
  lore-sell-enabled: "<gray>Sell: <gold>{sell}"
  lore-sell-disabled: "<gray>Sell: <red>Unavailable"
  lore-stock: "<gray>Stock: <yellow>{stock}<gray>/<yellow>{stock_max}"
  lore-blank: ""
  lore-hint-buy: "<dark_gray>Left-Click: <white>Buy {qty_mode}"
  lore-hint-buy-stack: "<dark_gray>Shift + Left-Click: <white>Buy 64"
  lore-hint-sell: "<dark_gray>Right-Click: <white>Sell 1"
  lore-hint-sell-all: "<dark_gray>Shift + Right-Click: <white>Sell All"
