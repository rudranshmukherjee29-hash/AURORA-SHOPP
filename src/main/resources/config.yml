# =====================================================================
#  AuroraShop — main configuration
#  Item prices live in prices.yml, NOT here. Nothing in this file
#  affects economic balance except the safety numbers under
#  "transactions" — everything else is server-operation behaviour.
# =====================================================================

database:
  # SQLITE (default, zero setup, fine for most servers) or MYSQL/MARIADB
  # (for networked/BungeeCord setups that need a shared backing store).
  type: SQLITE

  mysql:
    host: localhost
    port: 3306
    database: aurorashop
    username: aurorashop
    password: "changeme"
    useSSL: false
    # HikariCP pool size. 10 is plenty for a single shop plugin.
    poolSize: 10

transactions:
  # Hard ceiling on the quantity of a single buy/sell action, regardless of
  # quantity mode (including "max affordable" and "sell all"). This exists
  # purely as an overflow/sanity backstop — raising it does not change the
  # economy, only how large one click is allowed to be.
  maxTransactionSize: 10000

  # When a single transaction's total price/payout is at or above this
  # amount, AuroraShop opens a confirmation screen instead of completing
  # the transaction immediately. Set to a very large number to disable.
  confirmationThreshold: 5000.0

  # Minimum milliseconds that must pass between two transactions from the
  # same player. This is the anti-packet-spam throttle; it is intentionally
  # small so normal play never feels delayed.
  rateLimitMillis: 150

sell:
  # If true, an item can only be sold if it has no custom display name, no
  # enchantments, no custom model data, and no extra NBT beyond the plain
  # vanilla item. Strongly recommended: without this, a renamed/enchanted
  # copy of an item can be sold identically to the plain one, which is a
  # classic vector for "value laundering" of items that shouldn't exist.
  requireVanillaOnly: true

  # If true, selling a stock-limited item increases its remaining stock
  # back up (capped at the item's configured maximum). Off by default,
  # because most servers want limited-stock items to represent a
  # genuinely finite, admin-controlled offering.
  restockOnSell: false

stock:
  # How often (in minutes) the automatic-restock task runs for items that
  # have automatic restocking enabled in prices.yml.
  autoRestockIntervalMinutes: 60

logging:
  logTransactionsToConsole: false
  logFailedTransactions: true
