plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.aurorashop'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://jitpack.io' } // VaultAPI
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    // Provided by the server at runtime — never shaded.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // Bundled and relocated so we never clash with another plugin's copy.
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
    implementation 'com.zaxxer:HikariCP:5.1.0'
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('AuroraShop')

    // Relocate every shaded library into our own namespace. This is mandatory:
    // without it, two plugins bundling different HikariCP/SQLite versions on the
    // same server WILL classload the wrong one and crash in ways that are very
    // hard to diagnose.
    relocate 'com.zaxxer.hikari', 'com.aurorashop.libs.hikari'
    relocate 'org.sqlite', 'com.aurorashop.libs.sqlite'
    relocate 'org.mariadb.jdbc', 'com.aurorashop.libs.mariadb'
    relocate 'org.mariadb', 'com.aurorashop.libs.mariadborg'

    minimize {
        exclude(dependency('org.xerial:sqlite-jdbc'))
        exclude(dependency('org.mariadb.jdbc:mariadb-java-client'))
        exclude(dependency('com.zaxxer:HikariCP'))
    }
}

build {
    dependsOn shadowJar
}

tasks.named('jar') {
    enabled = false
}
